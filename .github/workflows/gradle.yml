name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код репозитория
    - uses: actions/checkout@v3

    # 2. Устанавливаем Java (для этого проекта обычно требуется JDK 11)
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    # 3. ВАЖНО: Даем права на исполнение скрипту gradlew (как в подсказке)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Запускаем целевой сервис в фоновом режиме (& в конце означает фон)
    - name: Start Application
      run: java -jar ./artifacts/app-mbank.jar &

    # 5. Даем приложению время на запуск (Spring Boot приложению нужно несколько секунд)
    - name: Wait for application to start
      run: sleep 10

    # 6. Запускаем тесты
    - name: Run Tests
      run: ./gradlew test
